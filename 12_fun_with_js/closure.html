<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Closure</title>
</head>
<body style="background-color: #212121; color: white">
    <button id="orange">Orange</button>
    <button id="green">Green</button>
</body>

<script>
    function makeFunc() {
        const name = "Mozilla";
        function displayName() {
            console.log(name);
        }
        return displayName;
    }

    const myFunc = makeFunc();
    myFunc();
</script>

<script>
    // document.getElementById("orange").addEventListener("click", function(){
    //     document.body.style.backgroundColor = this.getAttribute("id");
    // })
    // document.getElementById("green").addEventListener("click", function(){
    //     document.body.style.backgroundColor = this.getAttribute("id");
    // })

    function clickHandler(color){
        // document.body.style.backgroundColor = color;
        
        return function(){ // we did it bcoz the event listener expects to get a function in return
            document.body.style.backgroundColor = color;
        }
    }

    document.getElementById("orange").addEventListener("click",clickHandler("orange"));
    document.getElementById("green").onclick = clickHandler("green");
</script>
</html>
