<script>
    // function init() {
    //     let name = "Mozilla";
    //     function displayName() {
    //         console.log(name);
    //     }
    //     displayName();
    // }

    // init();

    function outer(){
        let username = "Prabhjot";

        function inner(){
            let secret = "my123";
            console.log("Inner 1 :",username);
        }
        
        
        function inner2(){
            console.log("Inner 2 :",username);
            console.log("secret:",secret); // bhai bhai aapas mai share nhi karte
        }
        
        inner();
        inner2(); // both have access of username 

        console.log("outer secret:",secret); // it also doesn't have access // bade bacchon se nhi mangte 
    }

    outer();
    console.log("TOO OUTER",username);

</script>
