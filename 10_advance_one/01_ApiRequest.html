<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: white;">
    <!-- 0	UNSENT	Client has been created. open() not called yet.
    <br>
    1	OPENED	open() has been called.
    <br>
    2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
    <br>
    3	LOADING	Downloading; responseText holds partial data.
    <br>
    4	DONE	The operation is complete. -->
    <header>
        <h1>USER-CARD</h1>
    </header>
    <main>
        <div class="card">
            <img src="https://sadgirldp.com/wp-content/uploads/No-Dp-Black.jpeg" alt="image">
            <h2 id="name">User Name</h2>
            <h3>Followers : <span id="follow">XXXX</span></h3>
        </div>
        <div class="button">
            <button id="btn">Fetch-Data</button>
        </div>
    </main>
</body>
<script>
    const URL = 'https://api.github.com/users/hiteshchoudhary';
    const btn = document.querySelector("#btn");
    const name = document.querySelector("#name");
    const follow = document.querySelector("#follow");
    const img = document.querySelector("img");
    
    function fetcher(requestUrl){
        const xhr = new XMLHttpRequest();
        xhr.open('GET',requestUrl);
        xhr.onreadystatechange = () => {
            console.log(xhr.readyState);
            if(xhr.readyState === 4){
                const data = JSON.parse(xhr.responseText);
                console.log(data);
                console.log(data.followers);
                console.log(data.name);
                console.log(data.avatar_url);

                const dataName = data.name;
                const dataFollow = data.followers;
                const dataImg = data.avatar_url;

                name.innerHTML = dataName;
                follow.innerHTML = dataFollow;
                img.setAttribute("src",dataImg);
            }
        };

        xhr.send();
    }

    btn.addEventListener("click",() => {
        fetcher(URL);
    });
    // console.log("HERE");
    // console.log(xhr.readyState);

</script>
</html>
