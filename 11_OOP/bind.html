<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bind</title>
</head>
<body style="background-color: #212121; color: white;">
    <button>Button Clicked</button>
</body>
<script>
    class React{
        constructor(){
            this.library = "React"
            this.server = "https://localhost:3000"

            // requirement 
            document
                    .querySelector("button")
                    .addEventListener("click", this.handleClick.bind(this)); // bind attaches the reference or current context 
        }

        handleClick(){
            console.log("Button Clicked");
            console.log(this);
            console.log(this.server);
        }
    }


    const app = new React();
    // console.log(app);
    // app.handleClick();
</script>
</html>
