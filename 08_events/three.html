<script>

    // ****** SET-INTERVAL ******
    function sayDate(str){
        console.log(str,Date.now());
    }
    const intervalId = setInterval(sayDate,1000,"Hi"); // (function,time,argument)


    // ******* CLEAR-INTERVAL *******
    clearInterval(intervalId);
